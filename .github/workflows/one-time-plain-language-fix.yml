name: One-time Worth Exploring loading and language fix

on:
  push:
    paths:
      - '.github/workflows/one-time-plain-language-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore static loading message and tighten plain-language rules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          analytics = Path('analytics.js')
          text = analytics.read_text()

          text = text.replace("  let loadingMessageTimer = null;\n", "")

          start_marker = "  function installLoadingMessagesUi() {\n"
          end_marker = "  function installPrivacyUi() {\n"
          if start_marker in text:
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              text = text[:start] + text[end:]

          text = text.replace("  installLoadingMessagesUi();\n", "")
          analytics.write_text(text)

          generate = Path('api/generate.js')
          prompt = generate.read_text()

          anchor = "The report should feel human-readable first. The user should never need to know how their answers were internally labeled.\n"
          addition = '''\nPLAIN-LANGUAGE GUARD — REQUIRED:\n- Use language an intelligent general reader can understand without workplace, product, management, consulting, or internet-culture jargon.\n- NEVER use \"bike shedding\", \"bikeshedding\", \"bike-shedding\", \"bikeshed\", or related jargon. Describe the actual behaviour plainly instead, such as \"getting stuck debating minor details\" or \"spending disproportionate time on low-stakes details.\"\n- Avoid obscure shorthand, insider terminology, trendy workplace phrases, or clever references unless the meaning is immediately obvious to a general reader.\n- Dry humour is allowed only when the reader can understand the underlying point without knowing the reference. Do not make insider jargon itself the joke.\n- Before finalizing the report, silently scan ALL user-facing text for language that could make a reader reasonably ask \"What does that mean?\" and rewrite it in ordinary language.\n'''

          if "PLAIN-LANGUAGE GUARD — REQUIRED:" not in prompt:
              if anchor not in prompt:
                  raise SystemExit('Could not find user-facing language anchor')
              prompt = prompt.replace(anchor, anchor + addition, 1)

          humour_anchor = "- feel dry and intelligent rather than silly or meme-like\n"
          humour_rule = "- be understandable without insider workplace terminology; if the joke depends on knowing a niche term or reference, rewrite it plainly\n"
          if humour_rule not in prompt:
              if humour_anchor not in prompt:
                  raise SystemExit('Could not find humour anchor')
              prompt = prompt.replace(humour_anchor, humour_anchor + humour_rule, 1)

          generate.write_text(prompt)
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics.js api/generate.js
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "Restore loading message and block insider jargon"
          git push
